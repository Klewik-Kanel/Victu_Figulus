<!-- ===========================================================================
     Victu illustration set.

     Original drawings, no brand packaging and no photographs: a diet app has
     to show a packet of chips without borrowing anyone's trade dress, and
     photos would weigh more than the entire rest of the app.

     Every shape uses the spice palette through CSS custom properties, so the
     whole set re-pigments itself in dark mode without a second copy. Drawn on
     a 32x32 grid with deliberately uneven curves - a perfectly symmetrical
     roti looks like a logo, not like food.

     Injected inline by app.js so external <use> and CORS never come into it.
     =========================================================================== -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true" id="victu-sprite" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- dal in a katori -->
  <symbol id="i-dal" viewBox="0 0 32 32">
    <path d="M4.5 13.5h23c0 7-4.6 12-11.5 12S4.5 20.5 4.5 13.5z" fill="var(--ill-steel)"/>
    <path d="M6.5 14.5h19c-.3 4.4-3.6 7.6-9.5 7.6s-9.2-3.2-9.5-7.6z" fill="var(--ill-turmeric)"/>
    <ellipse cx="16" cy="13.5" rx="11.5" ry="2.4" fill="var(--ill-steel-l)"/>
    <ellipse cx="16" cy="13.6" rx="9.3" ry="1.8" fill="var(--ill-turmeric-d)"/>
    <circle cx="13" cy="13.3" r="1" fill="var(--ill-cumin)"/>
    <circle cx="18.4" cy="14.1" r=".8" fill="var(--ill-coriander)"/>
  </symbol>

  <!-- roti, slightly off-round because they always are -->
  <symbol id="i-roti" viewBox="0 0 32 32">
    <path d="M16 5.2c6.6 0 11.4 4.4 11.4 10.6 0 6.4-5.2 10.9-11.7 10.9S4.2 22.1 4.2 15.6C4.2 9.5 9.2 5.2 16 5.2z" fill="var(--ill-wheat)"/>
    <path d="M11 9.6c2.6-1.2 6.6-1.4 9.3.2" stroke="var(--ill-wheat-d)" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <ellipse cx="12.4" cy="17.4" rx="2.3" ry="1.7" fill="var(--ill-wheat-d)"/>
    <ellipse cx="19.6" cy="14.6" rx="1.6" ry="1.2" fill="var(--ill-wheat-d)"/>
    <ellipse cx="17.6" cy="20.4" rx="1.3" ry="1" fill="var(--ill-wheat-d)"/>
  </symbol>

  <!-- rice heap -->
  <symbol id="i-rice" viewBox="0 0 32 32">
    <path d="M16 7.5c4.4 2 8.2 6.2 9.6 11.2H6.4C7.8 13.7 11.6 9.5 16 7.5z" fill="var(--ill-rice)"/>
    <path d="M5 18.7h22c0 4.3-4.9 7.3-11 7.3S5 23 5 18.7z" fill="var(--ill-steel)"/>
    <ellipse cx="16" cy="18.7" rx="11" ry="2.1" fill="var(--ill-steel-l)"/>
    <path d="M13 12.6l1.6 1M18 11.4l1.3 1.3M15.4 15.6l1.8.7" stroke="var(--ill-rice-d)" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>

  <!-- sabzi: mixed vegetables -->
  <symbol id="i-sabzi" viewBox="0 0 32 32">
    <path d="M4.5 14h23c0 7-4.6 11.8-11.5 11.8S4.5 21 4.5 14z" fill="var(--ill-steel)"/>
    <ellipse cx="16" cy="14" rx="11.5" ry="2.3" fill="var(--ill-steel-l)"/>
    <circle cx="12" cy="13.6" r="2.6" fill="var(--ill-coriander)"/>
    <circle cx="17.4" cy="14.4" r="2.2" fill="var(--ill-chilli)"/>
    <circle cx="21" cy="13.2" r="1.8" fill="var(--ill-turmeric)"/>
    <circle cx="14.6" cy="15.6" r="1.5" fill="var(--ill-coriander-d)"/>
  </symbol>

  <!-- curd / dahi -->
  <symbol id="i-curd" viewBox="0 0 32 32">
    <path d="M6 12h20l-1.6 11.6c-.3 2-3.9 3.2-8.4 3.2s-8.1-1.2-8.4-3.2z" fill="var(--ill-steel)"/>
    <ellipse cx="16" cy="12" rx="10" ry="2.6" fill="var(--ill-cream)"/>
    <ellipse cx="16" cy="12.2" rx="7.6" ry="1.8" fill="var(--ill-cream-d)"/>
  </symbol>

  <!-- chai in a cutting glass -->
  <symbol id="i-chai" viewBox="0 0 32 32">
    <path d="M10 8h12l-1.4 16.4c-.1 1.4-2.1 2.3-4.6 2.3s-4.5-.9-4.6-2.3z" fill="var(--ill-glass)"/>
    <path d="M10.7 13h10.6l-.9 11.2c-.1 1-1.6 1.7-3.8 1.7s-3.7-.7-3.8-1.7z" fill="var(--ill-chai)"/>
    <ellipse cx="16" cy="13" rx="5.3" ry="1.3" fill="var(--ill-chai-l)"/>
    <path d="M13.4 5.4c.7-1 .2-2 .2-2M16.6 5c.8-1.2.2-2.4.2-2.4M19.6 5.4c.6-1 .2-1.9.2-1.9" stroke="var(--ill-steam)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  </symbol>

  <!-- a packet. Generic shape, no trade dress. -->
  <symbol id="i-packet" viewBox="0 0 32 32">
    <path d="M8 6h16v20H8z" fill="var(--ill-foil)"/>
    <path d="M8 6h16v3.4H8zM8 22.6h16V26H8z" fill="var(--ill-foil-d)"/>
    <path d="M6.6 6h2.8v20H6.6zM22.6 6h2.8v20h-2.8z" fill="var(--ill-foil-d)" opacity=".55"/>
    <circle cx="16" cy="15.4" r="3.4" fill="var(--ill-chilli)"/>
    <path d="M12 12.2h2.4M12 18.4h3.6" stroke="var(--ill-foil-l)" stroke-width="1.3" stroke-linecap="round"/>
  </symbol>

  <!-- a can -->
  <symbol id="i-can" viewBox="0 0 32 32">
    <path d="M10.5 7h11v18.5c0 1-2.5 1.6-5.5 1.6s-5.5-.6-5.5-1.6z" fill="var(--ill-can)"/>
    <ellipse cx="16" cy="7" rx="5.5" ry="1.9" fill="var(--ill-can-l)"/>
    <path d="M10.5 13.4h11v5.6h-11z" fill="var(--ill-chilli)" opacity=".85"/>
    <ellipse cx="16" cy="7" rx="2.2" ry=".8" fill="var(--ill-can-d)"/>
  </symbol>

  <!-- fruit -->
  <symbol id="i-fruit" viewBox="0 0 32 32">
    <circle cx="15.4" cy="18" r="8.6" fill="var(--ill-fruit)"/>
    <path d="M15.4 9.4c-1-2.6.4-4.8 2.6-5.4-.2 2.4-.8 4.2-2.6 5.4z" fill="var(--ill-coriander)"/>
    <path d="M11.4 14.4c1-1.6 2.6-2.4 4-2.4" stroke="var(--ill-fruit-l)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </symbol>

  <!-- egg -->
  <symbol id="i-egg" viewBox="0 0 32 32">
    <ellipse cx="16" cy="18" rx="8.8" ry="6.6" fill="var(--ill-cream)"/>
    <circle cx="16" cy="17.4" r="3.8" fill="var(--ill-turmeric)"/>
    <circle cx="14.8" cy="16.4" r="1.2" fill="var(--ill-turmeric-l)"/>
  </symbol>

  <!-- paneer cubes -->
  <symbol id="i-paneer" viewBox="0 0 32 32">
    <path d="M7 13.5l5.6-3.2 5.6 3.2-5.6 3.2z" fill="var(--ill-cream)"/>
    <path d="M7 13.5v5.8l5.6 3.2v-5.8z" fill="var(--ill-cream-d)"/>
    <path d="M18.2 13.5v5.8l-5.6 3.2v-5.8z" fill="var(--ill-cream-m)"/>
    <path d="M16.8 10.2l5.2-3 5.2 3-5.2 3z" fill="var(--ill-cream)"/>
    <path d="M16.8 10.2v5.4l5.2 3v-5.4z" fill="var(--ill-cream-d)"/>
    <path d="M27.2 10.2v5.4l-5.2 3v-5.4z" fill="var(--ill-cream-m)"/>
  </symbol>

  <!-- mushroom, since it started this -->
  <symbol id="i-mushroom" viewBox="0 0 32 32">
    <path d="M6 16c0-5.4 4.5-9.4 10-9.4s10 4 10 9.4c0 1.4-1.2 2-3 2H9c-1.8 0-3-.6-3-2z" fill="var(--ill-cumin)"/>
    <path d="M13 18h6v6.4c0 1.4-1.3 2.4-3 2.4s-3-1-3-2.4z" fill="var(--ill-cream)"/>
    <ellipse cx="12" cy="12.6" rx="2.4" ry="1.6" fill="var(--ill-cumin-l)"/>
    <ellipse cx="19.4" cy="14" rx="1.6" ry="1.1" fill="var(--ill-cumin-l)"/>
  </symbol>

  <!-- leafy greens -->
  <symbol id="i-greens" viewBox="0 0 32 32">
    <path d="M16 26c0-7 3-12.6 9.4-15-1 8.2-4 13.2-9.4 15z" fill="var(--ill-coriander)"/>
    <path d="M16 26C16 19 13 13.4 6.6 11c1 8.2 4 13.2 9.4 15z" fill="var(--ill-coriander-d)"/>
    <path d="M16 26.6V17" stroke="var(--ill-coriander-l)" stroke-width="1.4" stroke-linecap="round"/>
  </symbol>

  <!-- sweet / mithai -->
  <symbol id="i-sweet" viewBox="0 0 32 32">
    <path d="M6.4 11.4h19.2v9.2H6.4z" fill="var(--ill-mithai)"/>
    <path d="M6.4 11.4h19.2v2.6H6.4z" fill="var(--ill-silver)"/>
    <circle cx="11" cy="17" r="1.3" fill="var(--ill-cumin)"/>
    <circle cx="16" cy="17.8" r="1.1" fill="var(--ill-cumin)"/>
    <circle cx="21" cy="16.6" r="1.2" fill="var(--ill-cumin)"/>
  </symbol>

  <!-- empty plate, for empty states -->
  <symbol id="i-empty-plate" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="26" fill="none" stroke="var(--ill-steel-l)" stroke-width="2.6"/>
    <circle cx="32" cy="32" r="18" fill="none" stroke="var(--ill-steel-l)" stroke-width="1.4" opacity=".55"/>
    <circle cx="32" cy="32" r="9" fill="none" stroke="var(--ill-steel-l)" stroke-width="1" opacity=".35" stroke-dasharray="3 4"/>
  </symbol>

  <!-- empty shelf, for the kitchen -->
  <symbol id="i-empty-shelf" viewBox="0 0 64 64">
    <path d="M8 24h48M8 42h48" stroke="var(--ill-steel-l)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M14 24V14.5c0-1.4 1-2.5 2.4-2.5h5.2c1.4 0 2.4 1.1 2.4 2.5V24" fill="none" stroke="var(--ill-steel-l)" stroke-width="1.8" opacity=".5"/>
    <circle cx="40" cy="18.6" r="5.4" fill="none" stroke="var(--ill-steel-l)" stroke-width="1.8" opacity=".5"/>
  </symbol>

</svg>
